[workspace]
members = ["crates/core", "crates/server", "crates/wasm"]
default-members = ["crates/core", "crates/server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.release.package.modpacks-migrator-wasm]
opt-level = "s"
