[package]
name = "modpacks-migrator-core"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
async-trait = "0.1"
hex = "0.4"
serde_json = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "1"
