[package]
name = "modpacks-migrator-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["curseforge"]
curseforge = []

[dependencies]
modpacks-migrator-core = { path = "../core" }
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["io"] }

[build-dependencies]
dotenvy = "0.15"

[dev-dependencies]
dotenvy = "0.15"
