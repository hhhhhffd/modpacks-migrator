[package]
name = "modpacks-migrator-wasm"
version = "0.1.0"
edition = "2021"
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["curseforge"]
curseforge = []

[dependencies]
modpacks-migrator-core = { path = "../core" }
async-trait = "0.1"
js-sys = "0.3"
serde = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"

[build-dependencies]
dotenvy = "0.15"
